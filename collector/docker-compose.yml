# ============================================================
# Ixora Observability Platform — Docker Compose
# Phase 4 — Prometheus Metrics Backend
#
# Active services:
#   collector   — OpenTelemetry Collector (Phase 3)
#   prometheus  — Prometheus TSDB, 30-day retention (Phase 4)
#
# Stubbed for later phases:
#   loki        — Phase 5
#   tempo       — Phase 6
#   grafana     — Phase 9
#
# Usage:
#   cp .env.example .env  && fill secrets
#   docker compose up -d collector prometheus
#   docker compose ps
#   curl http://localhost:13133/health
#   curl http://localhost:9090/-/healthy
# ============================================================

# ============================================================
# NETWORKS
# Internal-only bridge for Collector → backends (localhost equiv).
# All backend containers share this network in later phases.
# ============================================================
networks:
  observability:
    driver: bridge
    internal: false   # Collector needs outbound for health checks
    name: ixora-observability

# ============================================================
# VOLUMES
# Named volumes for persistent backend data.
# Only declared here so Phase 4–9 containers can reference them
# without recreating this file.
# ============================================================
volumes:
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================
# SERVICES
# ============================================================
services:

  # ----------------------------------------------------------
  # OpenTelemetry Collector
  # Phase 3 — the ONLY active service.
  # ----------------------------------------------------------
  collector:
    # Pin to a specific release — never use :latest in infra.
    # Update OTEL_COLLECTOR_VERSION in .env to upgrade.
    image: "otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.115.1}"
    container_name: ixora-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yaml"

    # Environment variables injected from .env
    environment:
      # Deployment identity.
      OTEL_DEPLOYMENT_ENVIRONMENT: "${OTEL_DEPLOYMENT_ENVIRONMENT:-staging}"
      # API keys for ingest auth — never hardcoded.
      OTEL_INGEST_API_KEY_BACKEND: "${OTEL_INGEST_API_KEY_BACKEND}"
      OTEL_INGEST_API_KEY_MOBILE: "${OTEL_INGEST_API_KEY_MOBILE}"
      # Resource limits for memory_limiter processor.
      OTEL_MEMORY_LIMIT_MIB: "${OTEL_MEMORY_LIMIT_MIB:-512}"
      OTEL_MEMORY_SPIKE_LIMIT_MIB: "${OTEL_MEMORY_SPIKE_LIMIT_MIB:-128}"

    volumes:
      # Collector configuration — read-only bind mount.
      - type: bind
        source: ./config.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
      # TLS certificates (optional — only needed when Collector
      # terminates TLS directly rather than via reverse proxy).
      # Mount only when OTEL_TLS_CERT_FILE / OTEL_TLS_KEY_FILE are set.
      # - type: bind
      #   source: /etc/otel/tls
      #   target: /etc/otel/tls
      #   read_only: true

    ports:
      # ---- Public (exposed by firewall / reverse proxy) ----
      # OTLP gRPC — backend clients (back_vibes-api, back_vibes-worker).
      - "${OTEL_GRPC_PORT:-4317}:4317"
      # OTLP HTTP — backend clients + mobile fallback.
      - "${OTEL_HTTP_PORT:-4318}:4318"
      # OTLP HTTP — mobile-dedicated port.
      - "${OTEL_HTTP_MOBILE_PORT:-4319}:4319"

      # ---- Internal / ops only (bind to 127.0.0.1) ----
      # Collector self-metrics scrape endpoint.
      - "127.0.0.1:${OTEL_SELF_METRICS_PORT:-8888}:8888"
      # Health check extension.
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
      # pprof profiling (ops only).
      - "127.0.0.1:${OTEL_PPROF_PORT:-1777}:1777"
      # zPages diagnostics (ops only).
      - "127.0.0.1:${OTEL_ZPAGES_PORT:-55679}:55679"

    networks:
      - observability

    # Resource limits — Phase 3 baseline (4 vCPU / 8 GB VM).
    # Tune per infrastructure-review.md §10 after load testing.
    deploy:
      resources:
        limits:
          cpus: "1.0"    # Max 1 vCPU for Collector; leaves headroom for backends
          memory: "768M" # memory_limiter hard limit (512 MiB) + headroom
        reservations:
          cpus: "0.25"
          memory: "256M"

    # Distroless image has no shell/wget — health is verified from the host
    # (curl http://127.0.0.1:13133/health). See collector/README.md §Validation.
    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # PHASE 4 — Prometheus Metrics Backend
  # ADR-028: internal only; never publicly reachable.
  # ADR-031: 30-day TSDB retention.
  # Security: bound to 127.0.0.1 on the host; accessible to
  #           Collector via Docker network (service name: prometheus).
  # ============================================================
  prometheus:
    # Pin to a specific release — never use :latest.
    # Update PROMETHEUS_VERSION in .env to upgrade.
    image: "prom/prometheus:${PROMETHEUS_VERSION:-v2.54.1}"
    container_name: ixora-prometheus
    restart: unless-stopped

    command:
      # Configuration file (read-only bind mount below).
      - "--config.file=/etc/prometheus/prometheus.yml"

      # TSDB storage path (named volume — persists across restarts).
      - "--storage.tsdb.path=/prometheus"

      # Retention: 30 days per ADR-031 §MVP retention.
      # Prometheus enforces this by deleting blocks older than the limit.
      - "--storage.tsdb.retention.time=30d"

      # Bind inside container to all interfaces so Docker network
      # allows Collector (on same bridge) to reach :9090.
      # Host-side exposure restricted to 127.0.0.1 via ports mapping.
      - "--web.listen-address=0.0.0.0:9090"

      # Enable the remote write receiver so the Collector can push
      # metrics via prometheusremotewrite exporter.
      # Endpoint: POST /api/v1/write
      - "--web.enable-remote-write-receiver"

      # Enable lifecycle API (POST /-/reload) for hot config reload.
      # Used after rule file changes (Phase 10+).
      # Bound to internal network only — no public exposure.
      - "--web.enable-lifecycle"

      # WAL compression reduces disk I/O on spinning-disk VMs.
      # Enabled by default in Prometheus 2.54+; explicit for clarity.
      - "--storage.tsdb.wal-compression"

      # TSDB block duration — default 2h, sufficient for MVP.
      # Increasing reduces compaction CPU at cost of query granularity.
      # Leave default unless Phase 10 profiling reveals compaction pressure.
      # - "--storage.tsdb.min-block-duration=2h"

    volumes:
      # TSDB data — named volume; persists across container restarts
      # and upgrades (docker compose up --no-deps prometheus).
      - prometheus_data:/prometheus

      # Prometheus configuration — read-only bind mount.
      # Edit prometheus/prometheus.yml and reload: POST /-/reload
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true

    ports:
      # Internal only — accessible from host for Grafana (Phase 9)
      # and ops debugging. Firewall MUST block port 9090 from internet.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    networks:
      # Same bridge as Collector — enables service-name DNS resolution.
      # Collector reaches Prometheus at http://prometheus:9090
      - observability

    # Resource limits — tuned for single VM alongside Collector.
    # infrastructure-review.md §10: Prometheus ~1 GB steady state
    # with ≤10 000 series and 30d retention.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"

    # Healthcheck using Prometheus built-in ready endpoint.
    # /-/healthy returns 200 when Prometheus is ready to serve.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

