# ============================================================
# Ixora Observability Platform — Notification Policies
# Phase 8.8 — Alerting Foundation (placeholder)
#
# This file provisions the Grafana alerting routing tree.
# It controls which alerts go to which contact points,
# and how they are grouped and deduplicated.
#
# STATUS: PLACEHOLDER — routes all alerts to ixora-default (UI only).
# Phase 9 will define severity-based routing to Slack/email.
#
# ROUTING DESIGN (Phase 9):
#
#   Root policy (catch-all → ixora-default)
#   ├── severity=emergency → ixora-email-emergency + ixora-slack-critical
#   ├── severity=critical  → ixora-slack-critical
#   │     group_by: [service, environment]
#   │     group_wait: 30s
#   │     group_interval: 5m
#   │     repeat_interval: 1h
#   ├── severity=warning   → ixora-slack-warnings
#   │     group_by: [category, environment]
#   │     group_wait: 2m
#   │     group_interval: 15m
#   │     repeat_interval: 4h
#   └── severity=info      → ixora-default (Grafana UI only)
#
# INHIBITION RULES (Phase 9):
#   - Collector Down (emergency) → suppress all application/business alerts
#   - Prometheus Down (critical) → suppress all metric-based alerts
#
# STRUCTURE REFERENCE: alerting-foundation.md §6
# PHILOSOPHY REFERENCE: alerting-philosophy.md §17
# ============================================================

apiVersion: 1

policies:
  - orgId: 1
    receiver: ixora-default
    group_by:
      - alertname
      - environment
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
