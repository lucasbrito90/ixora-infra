        expr: |
          ixora:slo:telemetry:burn_rate:5m > 10
          and ixora:slo:telemetry:burn_rate:1h > 10
          and ixora:slo:telemetry:eligible_exports:1h > 1000
        for: 2m
        labels:
          severity: critical
