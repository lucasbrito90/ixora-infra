      - alert: IxoraSLOSchedulerSuccessMediumBurnWarning
        expr: |
          ixora:slo:scheduler:burn_rate:5m{environment=~".+"} > 2
          and ixora:slo:scheduler:burn_rate:6h{environment=~".+"} > 2
          and ixora:slo:scheduler:eligible_events:1h{environment=~".+"} > 5
